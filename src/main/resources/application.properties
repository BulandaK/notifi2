spring.application.name=notifi

spring.datasource.url=jdbc:postgresql://localhost:5432/notifications
spring.datasource.username=app
spring.datasource.password=app

# na razie; później zamienimy na Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# lokalnie (IntelliJ) startuje API; w Dockerze profil ustawia SPRING_PROFILES_ACTIVE
spring.profiles.default=api

spring.rabbitmq.listener.simple.prefetch=1
# publisher confirms: dispatcher czeka, az broker potwierdzi zapis wiadomosci
spring.rabbitmq.publisher-confirm-type=simple

# ciche godziny w strefie odbiorcy - wysylka nocna przesuwana na rano
notifi.quiet-hours.start=22:00
notifi.quiet-hours.end=08:00
# 0.0 = zawsze sukces; np. 0.5 = co druga proba sie nie udaje (test ponawiania)
notifi.simulation.failure-rate=0.0