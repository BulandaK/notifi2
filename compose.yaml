services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # 4.x: kolejki quorum obsługują priorytety wiadomości
    image: rabbitmq:4.1-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports: [ "8080:8080" ]
    environment:
      SPRING_PROFILES_ACTIVE: api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  email-worker:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: email-worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      NOTIFI_SIMULATION_FAILURE_RATE: "0.0"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api: { condition: service_started }

  push-worker:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: push-worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      NOTIFI_SIMULATION_FAILURE_RATE: "0.0"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api: { condition: service_started }
